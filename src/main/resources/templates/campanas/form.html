<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Campañas de Vacunación</title>
    <!-- Bootstrap CSS para estilos rápidos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="mb-4">Campañas de Vacunación</h2>

    <!-- Formulario de Registro / Edición -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0">Crear / Editar Campaña</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/campanas/guardar}" th:object="${campana}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row mb-3">
                    <!-- Campo Nombre -->
                    <div class="col-md-6">
                        <label for="nombre" class="form-label">Nombre de la Campaña:</label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required placeholder="Ej. Campaña Antirrábica 2026" />
                    </div>

                    <!-- Campo Estado -->
                    <div class="col-md-6">
                        <label for="estado" class="form-label">Estado:</label>
                        <select id="estado" th:field="*{estado}" class="form-select" required>
                            <option value="">-- Seleccionar Estado --</option>
                            <option value="Planificada">Planificada</option>
                            <option value="En Curso">En Curso</option>
                            <option value="Finalizada">Finalizada</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <!-- Selector Fecha Inicio -->
                    <div class="col-md-6">
                        <label for="fechaInicio" class="form-label">Fecha de Inicio:</label>
                        <input type="date" id="fechaInicio" th:field="*{fechaInicio}" class="form-control" required />
                    </div>

                    <!-- Selector Fecha Fin -->
                    <div class="col-md-6">
                        <label for="fechaFin" class="form-label">Fecha de Fin:</label>
                        <input type="date" id="fechaFin" th:field="*{fechaFin}" class="form-control" required />
                    </div>
                </div>

                <button type="submit" class="btn btn-success">Guardar Campaña</button>
            </form>
        </div>
    </div>

    <!-- Listado de Campañas -->
    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">
            <h5 class="card-title mb-0">Listado de Campañas</h5>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Fin</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${campanas}">
                    <td th:text="${c.id}">1</td>
                    <td th:text="${c.nombre}">Campaña Ejemplo</td>
                    <td th:text="${#temporals.format(c.fechaInicio, 'yyyy-MM-dd')}">2026-01-01</td>
                    <td th:text="${#temporals.format(c.fechaFin, 'yyyy-MM-dd')}">2026-01-15</td>
                    <td>
                        <span class="badge" th:classappend="${c.estado == 'En Curso' ? 'bg-success' : (c.estado == 'Planificada' ? 'bg-warning text-dark' : 'bg-secondary')}" th:text="${c.estado}">Planificada</span>
                    </td>
                    <td>
                        <a th:href="@{/campanas/editar/{id}(id=${c.id})}" class="btn btn-sm btn-primary">Editar</a>
                        <a th:href="@{/campanas/eliminar/{id}(id=${c.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que deseas eliminar esta campaña?');">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(campanas)}">
                    <td colspan="6" class="text-center text-muted">No hay campañas registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
