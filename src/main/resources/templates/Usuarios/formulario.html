<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title th:text="${usuario.idUsuario} != null ? 'Editar Usuario' : 'Crear Usuario'">Usuario</title>
</head>
<body>
<div layout:fragment="content">

    <h2 class="mt-4" th:text="${usuario.idUsuario} != null ? 'Editar Usuario' : 'Crear Usuario'">Usuario</h2>
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item"><a th:href="@{/usuarios}">Usuarios</a></li>
        <li class="breadcrumb-item active" th:text="${usuario.idUsuario} != null ? 'Editar' : 'Crear'">Formulario</li>
    </ol>

    <div class="card mb-4">
        <div class="card-header">
            <i class="fas fa-user"></i>
            <span th:text="${usuario.idUsuario} != null ? ' Editar Usuario' : ' Crear Usuario'"></span>
        </div>
        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:if="${usuario.idUsuario} != null"
                  th:action="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}"
                  th:object="${usuario}" method="post">

                <div class="mb-3">
                    <label for="nombreCompleto" class="form-label">Nombre completo</label>
                    <input type="text" class="form-control" id="nombreCompleto"
                           th:field="*{nombreCompleto}" required maxlength="150"/>
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label">Correo</label>
                    <input type="email" class="form-control" id="correo"
                           th:field="*{correo}" required maxlength="100"/>
                </div>

                <div class="mb-3">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena"
                           th:field="*{contrasena}" maxlength="255"/>
                    <div class="form-text">
                        Dejar en blanco para no cambiarla
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="rol" class="form-label">Rol</label>
                        <select class="form-select" id="rol" th:field="*{rol}" required>
                            <option value="">-- Selecciona un rol --</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="estado" class="form-label">Estado</label>
                        <select class="form-select" id="estado" th:field="*{estado}" required>
                            <option value="">-- Selecciona un estado --</option>
                            <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar
                </button>
                <a th:href="@{/usuarios}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </form>

            <form th:unless="${usuario.idUsuario} != null"
                  th:action="@{/usuarios/crear}"
                  th:object="${usuario}" method="post">

                <div class="mb-3">
                    <label for="nombreCompleto2" class="form-label">Nombre completo</label>
                    <input type="text" class="form-control" id="nombreCompleto2"
                           th:field="*{nombreCompleto}" required maxlength="150"/>
                </div>

                <div class="mb-3">
                    <label for="correo2" class="form-label">Correo</label>
                    <input type="email" class="form-control" id="correo2"
                           th:field="*{correo}" required maxlength="100"/>
                </div>

                <div class="mb-3">
                    <label for="contrasena2" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena2"
                           th:field="*{contrasena}" maxlength="255"/>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="rol2" class="form-label">Rol</label>
                        <select class="form-select" id="rol2" th:field="*{rol}" required>
                            <option value="">-- Selecciona un rol --</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="estado2" class="form-label">Estado</label>
                        <select class="form-select" id="estado2" th:field="*{estado}" required>
                            <option value="">-- Selecciona un estado --</option>
                            <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar
                </button>
                <a th:href="@{/usuarios}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </form>

        </div>
    </div>

</div>
</body>
</html>
