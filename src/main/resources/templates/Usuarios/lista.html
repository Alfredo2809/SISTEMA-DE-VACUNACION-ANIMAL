<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Usuarios</title>
</head>
<body>
<div layout:fragment="content">

    <h2 class="mt-4">Usuarios</h2>
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item active">Tabla de Usuarios</li>
    </ol>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fas fa-users"></i> Tabla de Usuarios</span>
            <a th:href="@{/usuarios/crear}" class="btn btn-primary btn-sm">
                <i class="fas fa-plus"></i> Nuevo usuario
            </a>
        </div>
        <div class="card-body">

            <form th:action="@{/usuarios}" method="get" class="row g-2 mb-3">
                <div class="col-auto">
                    <input type="text" class="form-control" name="nombre" th:value="${nombre}"
                           placeholder="Buscar por nombre"/>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-outline-secondary">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-bordered table-striped" width="100%" cellspacing="0">
                    <thead>
                    <tr>
                        <th>Nombre completo</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios.content}">
                        <td th:text="${u.nombreCompleto}"></td>
                        <td th:text="${u.correo}"></td>
                        <td th:text="${u.rol}"></td>
                        <td th:text="${u.estado}"></td>
                        <td>
                            <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}"
                               class="btn btn-sm btn-warning" title="Editar">
                                <i class="fas fa-edit"></i>
                            </a>

                            <!-- Cambio rápido de rol -->
                            <form th:action="@{/usuarios/{id}/cambiar-rol(id=${u.idUsuario})}"
                                  method="post" class="d-inline-block">
                                <select name="nuevoRol" class="form-select form-select-sm d-inline-block w-auto"
                                        onchange="this.form.submit()">
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                            th:selected="${r} == ${u.rol}"></option>
                                </select>
                            </form>

                            <!-- Cambio rápido de estado -->
                            <form th:action="@{/usuarios/{id}/cambiar-estado(id=${u.idUsuario})}"
                                  method="post" class="d-inline-block">
                                <select name="nuevoEstado" class="form-select form-select-sm d-inline-block w-auto"
                                        onchange="this.form.submit()">
                                    <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"
                                            th:selected="${e} == ${u.estado}"></option>
                                </select>
                            </form>

                            <form th:action="@{/usuarios/eliminar/{id}(id=${u.idUsuario})}"
                                  method="post" class="d-inline-block"
                                  onsubmit="return confirm('¿Eliminar este usuario?');">
                                <button type="submit" class="btn btn-sm btn-danger" title="Eliminar">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>
</body>
</html>
