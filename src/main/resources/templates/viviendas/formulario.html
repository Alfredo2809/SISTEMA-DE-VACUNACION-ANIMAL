<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title th:text="${titulo != null ? titulo : 'Formulario Vivienda'}">Vivienda</title>
</head>
<body>

<div layout:fragment="content">
    <h1 class="mt-4" th:text="${titulo != null ? titulo : 'Formulario de Vivienda'}">Formulario</h1>
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item"><a th:href="@{/viviendas}">Viviendas</a></li>
        <li class="breadcrumb-item active">Formulario</li>
    </ol>

    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">
                    <i class="fas fa-home me-1"></i>
                    Datos de la Vivienda
                </div>
                <div class="card-body">
                    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-triangle me-1"></i>
                        <span th:text="${mensajeError}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!--/*@thymesVar id="vivienda" type="org.esfe.vacunacion.modelos.Vivienda"*/-->
                    <form th:action="@{/viviendas/guardar}" th:object="${vivienda}" method="post">
                        <!-- Campo oculto para el ID -->
                        <input type="hidden" th:field="*{idVivienda}" />

                        <div class="mb-3">
                            <label for="direccion" class="form-label">Dirección</label>
                            <input type="text"
                                   id="direccion"
                                   class="form-control"
                                   th:field="*{direccion}"
                                   th:errorclass="is-invalid"
                                   placeholder="Ingrese la dirección completa" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="referenciaUbicacion" class="form-label">Referencia de Ubicación</label>
                            <input type="text"
                                   id="referenciaUbicacion"
                                   class="form-control"
                                   th:field="*{referenciaUbicacion}"
                                   th:errorclass="is-invalid"
                                   placeholder="Ingrese una referencia (opcional)" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('referenciaUbicacion')}" th:errors="*{referenciaUbicacion}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="colonia" class="form-label">Colonia</label>
                            <select id="colonia" class="form-select" th:field="*{colonia.idColonia}" th:errorclass="is-invalid">
                                <option value="">-- Seleccione una colonia --</option>
                                <option th:each="colonia : ${colonias}"
                                        th:value="${colonia.idColonia}"
                                        th:text="${colonia.nombre}">
                                </option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('colonia')}" th:errors="*{colonia}"></div>
                        </div>

                        <div class="d-flex justify-content-between pt-2">
                            <a th:href="@{/viviendas}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save me-1"></i>Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
