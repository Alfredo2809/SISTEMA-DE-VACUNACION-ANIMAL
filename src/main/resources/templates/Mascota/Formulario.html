<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title th:text="${mascota.idMascota} != null ? 'Editar Mascota' : 'Crear Mascota'">Mascota</title>
</head>
<body>
<div layout:fragment="content">

    <h2 class="mt-4" th:text="${mascota.idMascota} != null ? 'Editar Mascota' : 'Crear Mascota'">Mascota</h2>
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item"><a th:href="@{/mascotas}">Mascotas</a></li>
        <li class="breadcrumb-item active" th:text="${mascota.idMascota} != null ? 'Editar' : 'Crear'">Formulario</li>
    </ol>

    <div class="card mb-4">
        <div class="card-header">
            <i class="fas fa-paw"></i>
            <span th:text="${mascota.idMascota} != null ? ' Editar Mascota' : ' Crear Mascota'"></span>
        </div>
        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="${mascota.idMascota} != null
                              ? @{/mascotas/editar/{id}(id=${mascota.idMascota})}
                              : @{/mascotas/crear}"
                  th:object="${mascota}" method="post">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre"
                           th:field="*{nombre}" required maxlength="100"/>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="especie" class="form-label">Especie</label>
                        <select class="form-select" id="especie" th:field="*{especie}" required>
                            <option value="">-- Selecciona una especie --</option>
                            <option th:each="e : ${especies}" th:value="${e}" th:text="${e}"></option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="estado" class="form-label">Estado</label>
                        <select class="form-select" id="estado" th:field="*{estado}" required>
                            <option value="">-- Selecciona un estado --</option>
                            <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                        <input type="date" class="form-control" id="fechaNacimiento"
                               th:field="*{fechaNacimiento}" required/>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="edadAproximadaMeses" class="form-label">Edad aproximada (meses)</label>
                        <input type="number" class="form-control" id="edadAproximadaMeses"
                               th:field="*{edadAproximadaMeses}" required min="0"/>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="responsable" class="form-label">Responsable</label>
                        <select class="form-select" id="responsable" name="responsable.idResponsable" required>
                            <option value="">-- Selecciona un responsable --</option>
                            <option th:each="r : ${responsables}" th:value="${r.idResponsable}" th:text="${r.nombreCompleto}"
                                    th:selected="${mascota.responsable != null} and ${r.idResponsable} == ${mascota.responsable.idResponsable}"></option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="vivienda" class="form-label">Vivienda</label>
                        <select class="form-select" id="vivienda" name="vivienda.idVivienda" required>
                            <option value="">-- Selecciona una vivienda --</option>
                            <option th:each="v : ${viviendas}" th:value="${v.idVivienda}" th:text="${v.direccion}"
                                    th:selected="${mascota.vivienda != null} and ${v.idVivienda} == ${mascota.vivienda.idVivienda}"></option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar
                </button>
                <a th:href="@{/mascotas}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </form>

        </div>
    </div>

</div>
</body>
</html>
