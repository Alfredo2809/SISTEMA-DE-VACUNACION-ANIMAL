<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Colonias</title>
</head>
<body>

<div layout:fragment="content">
    <h1 class="mt-4">Gestión de Colonias</h1>
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item active">Mantenimiento de Colonias</li>
    </ol>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <div>
                <i class="fas fa-building me-1"></i>
                Listado de Colonias
            </div>
            <a th:href="@{/colonias/crear}" class="btn btn-primary btn-sm">
                <i class="fas fa-plus me-1"></i>Nueva Colonia
            </a>
        </div>
        <div class="card-body">
            <!-- Mensajes de alerta -->
            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-1"></i>
                <span th:text="${mensajeExito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-triangle me-1"></i>
                <span th:text="${mensajeError}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>


            <table class="table table-striped table-bordered table-hover mt-2">
                <thead class="table-dark">
                <tr>
                    <th style="width: 10%;">ID</th>
                    <th>Nombre de la Colonia</th>
                    <th>Cantón</th>
                    <th style="width: 20%;" class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="col : ${colonias}">
                    <td th:text="${col.idColonia}">1</td>
                    <td th:text="${col.nombre}">Colonia Escalón</td>
                    <td th:text="${col.canton != null ? col.canton.nombre : 'Sin asignación'}">El Carmen</td>
                    <td class="text-center">
                        <a th:href="@{/colonias/editar/{id}(id=${col.idColonia})}"
                           class="btn btn-warning btn-sm me-1"
                           title="Editar">
                            <i class="fas fa-edit"></i> Editar
                        </a>
                        <a th:href="@{/colonias/eliminar/{id}(id=${col.idColonia})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Está seguro de eliminar esta colonia?');"
                           title="Eliminar">
                            <i class="fas fa-trash"></i> Eliminar
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(colonias)}">
                    <td colspan="4" class="text-center text-muted py-3">
                        No hay colonias registradas actualmente.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
