<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title th:text="${departamento.idDepartamento} ? 'Editar Departamento' : 'Crear Departamento'"></title>
</head>
<body>
<main layout:fragment="main">
    <div class="row mb-4">
        <div class="col">
            <h1 th:text="${departamento.idDepartamento} ? 'Editar Departamento' : 'Crear Nuevo Departamento'"></h1>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/departamentos}" method="POST" th:object="${departamento}">
                <input type="hidden" th:field="*{idDepartamento}" />

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del Departamento *</label>
                    <input type="text" class="form-control" id="nombre"
                           th:field="*{nombre}"
                           placeholder="Ej: San Salvador"
                           required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                    <a th:href="@{/departamentos}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
