<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Departamentos</title>
</head>
<body>
<main layout:fragment="main">
    <div class="row mb-4">
        <div class="col">
            <h1><i class="fas fa-map"></i> Departamentos</h1>
        </div>
        <div class="col-auto">
            <a th:href="@{/departamentos/crear}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nuevo Departamento
            </a>
        </div>
    </div>

    <!-- Mensajes -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle"></i> <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Municipios</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="departamento : ${departamentos}">
                <td th:text="${departamento.idDepartamento}">1</td>
                <td th:text="${departamento.nombre}">San Salvador</td>
                <td>
                    <span class="badge bg-info" th:text="${departamento.municipios?.size() ?: 0}">0</span>
                </td>
                <td>
                    <a th:href="@{/departamentos/editar/{id}(id=${departamento.idDepartamento})}"
                       class="btn btn-sm btn-warning" title="Editar">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a th:href="@{/departamentos/eliminar/{id}(id=${departamento.idDepartamento})}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('¿Está seguro de eliminar este departamento?');"
                       title="Eliminar">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(departamentos)}">
                <td colspan="4" class="text-center text-muted">No hay departamentos registrados</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
