<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Campaña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="card shadow-sm col-md-8 mx-auto">
        <div class="card-header bg-primary text-white">
            <h4 class="card-title mb-0" th:text="${campana.idCampana != null} ? 'Editar Campaña' : 'Nueva Campaña'">Formulario Campaña</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/campanas/guardar}" th:object="${campana}" method="post">
                <input type="hidden" th:field="*{idCampana}" />

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre de la Campaña:</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Ej. Campaña Antirrábica 2026" required />
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="fechaInicio" class="form-label">Fecha de Inicio:</label>
                        <input type="date" id="fechaInicio" th:field="*{fechaInicio}" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label for="fechaFin" class="form-label">Fecha de Fin:</label>
                        <input type="date" id="fechaFin" th:field="*{fechaFin}" class="form-control" required />
                    </div>
                </div>

                <div class="mb-3">
                    <label for="estado" class="form-label">Estado:</label>
                    <select id="estado" th:field="*{estado}" class="form-select" required>
                        <option value="">-- Seleccionar Estado --</option>
                        <option value="Planificada">Planificada</option>
                        <option value="En Curso">En Curso</option>
                        <option value="Finalizada">Finalizada</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/campanas}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
