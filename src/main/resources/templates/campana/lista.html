<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Listado de Campañas</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Campañas de Vacunación</h2>
        <a th:href="@{/campanas/nuevo}" class="btn btn-primary">
            <i class="fas fa-plus me-1"></i>Nueva Campaña
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Fecha Inicio</th>
                        <th>Fecha Fin</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${campanas}">
                        <td th:text="${c.idCampana}">1</td>
                        <td th:text="${c.nombre}">Campaña Antirrábica</td>
                        <td th:text="${c.fechaInicio}">2026-01-01</td>
                        <td th:text="${c.fechaFin}">2026-01-15</td>
                        <td>
                            <span class="badge bg-info text-dark" th:text="${c.estado}">Planificada</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/campanas/editar/{id}(id=${c.idCampana})}" class="btn btn-sm btn-warning me-1">
                                <i class="fas fa-edit"></i> Editar
                            </a>
                            <a th:href="@{/campanas/eliminar/{id}(id=${c.idCampana})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Desea eliminar esta campaña?');">
                                <i class="fas fa-trash"></i> Eliminar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(campanas)}">
                        <td colspan="6" class="text-center text-muted py-4">No hay campañas registradas.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
