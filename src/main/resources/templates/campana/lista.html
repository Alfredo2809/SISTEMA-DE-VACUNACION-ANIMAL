<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Campañas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Campañas de Vacunación</h2>
        <a th:href="@{/campanas/nuevo}" class="btn btn-primary">Nueva Campaña</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Fin</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${campanas}">
                    <td th:text="${c.idCampana}">1</td>
                    <td th:text="${c.nombre}">Campaña Antirrábica</td>
                    <td th:text="${c.fechaInicio}">2026-01-01</td>
                    <td th:text="${c.fechaFin}">2026-01-15</td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${c.estado}">Planificada</span>
                    </td>
                    <td>
                        <a th:href="@{/campanas/editar/{id}(id=${c.idCampana})}" class="btn btn-sm btn-warning me-1">Editar</a>
                        <a th:href="@{/campanas/eliminar/{id}(id=${c.idCampana})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Desea eliminar esta campaña?');">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(campanas)}">
                    <td colspan="6" class="text-center text-muted">No hay campañas registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
