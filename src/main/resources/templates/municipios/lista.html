<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Municipios</title>
</head>
<body>

<div layout:fragment="content">
    <h1 class="mt-4">Gestión de Municipios</h1>
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item active">Mantenimiento de Municipios</li>
    </ol>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <div>
                <i class="fas fa-city me-1"></i>
                Listado de Municipios
            </div>
            <a th:href="@{/municipios/crear}" class="btn btn-primary btn-sm">
                <i class="fas fa-plus me-1"></i>Nuevo Municipio
            </a>
        </div>
        <div class="card-body">
            <!-- Mensajes de alerta -->
            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-1"></i>
                <span th:text="${mensajeExito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-triangle me-1"></i>
                <span th:text="${mensajeError}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Tabla de Municipios -->
            <table class="table table-striped table-bordered table-hover mt-2">
                <thead class="table-dark">
                <tr>
                    <th style="width: 10%;">ID</th>
                    <th>Nombre del Municipio</th>
                    <th>Departamento</th>
                    <th style="width: 20%;" class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="mun : ${municipios}">
                    <td th:text="${mun.idMunicipio}">1</td>
                    <td th:text="${mun.nombre}">San Salvador Centro</td>
                    <td th:text="${mun.departamento != null ? mun.departamento.nombre : 'Sin asignación'}">San Salvador</td>
                    <td class="text-center">
                        <a th:href="@{/municipios/editar/{id}(id=${mun.idMunicipio})}"
                           class="btn btn-warning btn-sm me-1"
                           title="Editar">
                            <i class="fas fa-edit"></i> Editar
                        </a>
                        <a th:href="@{/municipios/eliminar/{id}(id=${mun.idMunicipio})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Está seguro de eliminar este municipio?');"
                           title="Eliminar">
                            <i class="fas fa-trash"></i> Eliminar
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(municipios)}">
                    <td colspan="4" class="text-center text-muted py-3">
                        No hay municipios registrados actualmente.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
