<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Vacunación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="mb-4">Registro de Vacunación</h2>

    <!-- Formulario VAC-101 -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0">Formulario de Registro</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/registro-vacunacion/guardar}" th:object="${registro}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row mb-3">
                    <!-- Selector de Mascota -->
                    <div class="col-md-6">
                        <label for="mascota" class="form-label">Mascota:</label>
                        <select id="mascota" th:field="*{mascota}" class="form-select" required>
                            <option value="">-- Seleccionar Mascota --</option>
                            <option th:each="m : ${mascotas}"
                                    th:value="${m.id}"
                                    th:text="${m.nombre}">Pelusa</option>
                        </select>
                    </div>

                    <!-- Selector de Campaña -->
                    <div class="col-md-6">
                        <label for="campana" class="form-label">Campaña de Vacunación:</label>
                        <select id="campana" th:field="*{campana}" class="form-select" required>
                            <option value="">-- Seleccionar Campaña --</option>
                            <option th:each="c : ${campanas}"
                                    th:value="${c.id}"
                                    th:text="${c.nombre}">Campaña Antirrábica 2026</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <!-- Fecha de Aplicación -->
                    <div class="col-md-6">
                        <label for="fechaAplicacion" class="form-label">Fecha de Aplicación:</label>
                        <input type="date" id="fechaAplicacion" th:field="*{fechaAplicacion}" class="form-control" required />
                    </div>

                    <!-- Observaciones -->
                    <div class="col-md-6">
                        <label for="observaciones" class="form-label">Observaciones:</label>
                        <input type="text" id="observaciones" th:field="*{observaciones}" class="form-control" placeholder="Ej. Mascota no vacunada por fiebre / Dosis aplicada" />
                    </div>
                </div>

                <button type="submit" class="btn btn-success">Guardar Registro</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
