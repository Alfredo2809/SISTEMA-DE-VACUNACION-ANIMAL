<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Historial de Vacunación</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Historial de Vacunación</h2>
        <a th:href="@{/registros-vacunacion/nuevo}" class="btn btn-primary">
            <i class="fas fa-plus me-1"></i>Nuevo Registro
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Mascota</th>
                        <th>Campaña</th>
                        <th>Estado</th>
                        <th>Fecha Registro</th>
                        <th>Observaciones</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${registros}">
                        <td th:text="${r.idRegistro}">1</td>
                        <td th:text="${r.mascota != null ? r.mascota.nombre : 'N/A'}">Pelusa</td>
                        <td th:text="${r.campana != null ? r.campana.nombre : 'N/A'}">Campaña Antirrábica</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${r.estado != null and r.estado.name() == 'VACUNADO'} ? 'bg-success' : 'bg-warning text-dark'"
                                  th:text="${r.estado}">VACUNADO</span>
                        </td>
                        <td th:text="${#temporals.format(r.fechaRegistro, 'dd/MM/yyyy HH:mm')}">02/09/2026</td>
                        <td th:text="${r.observaciones}">Dosis aplicada</td>
                        <td class="text-center">
                            <a th:href="@{/registros-vacunacion/editar/{id}(id=${r.idRegistro})}" class="btn btn-sm btn-warning me-1">
                                <i class="fas fa-edit"></i> Editar
                            </a>
                            <a th:href="@{/registros-vacunacion/eliminar/{id}(id=${r.idRegistro})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Desea eliminar este registro?');">
                                <i class="fas fa-trash"></i> Eliminar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(registros)}">
                        <td colspan="7" class="text-center text-muted py-4">No hay registros de vacunación ingresados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
