<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Registros de Vacunación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Historial de Vacunación</h2>
        <a th:href="@{/registros-vacunacion/nuevo}" class="btn btn-primary">Nuevo Registro</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Mascota</th>
                    <th>Campaña</th>
                    <th>Estado</th>
                    <th>Fecha Registro</th>
                    <th>Observaciones</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${registros}">
                    <td th:text="${r.idRegistro}">1</td>
                    <td th:text="${r.mascota != null ? r.mascota.nombre : 'N/A'}">Pelusa</td>
                    <td th:text="${r.campana != null ? r.campana.nombre : 'N/A'}">Campaña Antirrábica</td>
                    <td>
                            <span class="badge"
                                  th:classappend="${r.estado != null and r.estado.name() == 'VACUNADO'} ? 'bg-success' : 'bg-warning text-dark'"
                                  th:text="${r.estado}">VACUNADO</span>
                    </td>
                    <td th:text="${#temporals.format(r.fechaRegistro, 'dd/MM/yyyy HH:mm')}">02/09/2026</td>
                    <td th:text="${r.observaciones}">Dosis aplicada</td>
                    <td>
                        <a th:href="@{/registros-vacunacion/editar/{id}(id=${r.idRegistro})}" class="btn btn-sm btn-warning me-1">Editar</a>
                        <a th:href="@{/registros-vacunacion/eliminar/{id}(id=${r.idRegistro})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Desea eliminar este registro?');">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(registros)}">
                    <td colspan="7" class="text-center text-muted">No hay registros de vacunación ingresados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
