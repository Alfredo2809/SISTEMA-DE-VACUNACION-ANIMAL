<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Registro Vacunación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="card shadow-sm col-md-8 mx-auto">
        <div class="card-header bg-primary text-white">
            <h4 class="card-title mb-0" th:text="${registro.idRegistro != null} ? 'Editar Registro' : 'Nuevo Registro de Vacunación'">Formulario Registro</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/registros-vacunacion/guardar}" th:object="${registro}" method="post">
                <input type="hidden" th:field="*{idRegistro}" />

                <div class="row mb-3">
                    <!-- Selector de Mascota -->
                    <div class="col-md-6">
                        <label for="mascota" class="form-label">Mascota:</label>
                        <select id="mascota" th:field="*{mascota.idMascota}" class="form-select" required>
                            <option value="">-- Seleccionar Mascota --</option>
                            <option th:each="m : ${mascotas}"
                                    th:value="${m.idMascota}"
                                    th:text="${m.nombre}">Pelusa</option>
                        </select>
                    </div>

                    <!-- Selector de Campaña -->
                    <div class="col-md-6">
                        <label for="campana" class="form-label">Campaña:</label>
                        <select id="campana" th:field="*{campana.idCampana}" class="form-select" required>
                            <option value="">-- Seleccionar Campaña --</option>
                            <option th:each="c : ${campanas}"
                                    th:value="${c.idCampana}"
                                    th:text="${c.nombre}">Campaña Antirrábica</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <!-- Selector de Usuario/Responsable -->
                    <div class="col-md-6">
                        <label for="usuario" class="form-label">Usuario / Aplicador:</label>
                        <select id="usuario" th:field="*{usuario.idUsuario}" class="form-select" required>
                            <option value="">-- Seleccionar Usuario --</option>
                            <option th:each="u : ${usuarios}"
                                    th:value="${u.idUsuario}"
                                    th:text="${u.nombre}">Juan Perez</option>
                        </select>
                    </div>

                    <!-- Estado de Vacunación -->
                    <div class="col-md-6">
                        <label for="estado" class="form-label">Estado:</label>
                        <select id="estado" th:field="*{estado}" class="form-select" required>
                            <option value="">-- Seleccionar Estado --</option>
                            <option th:each="e : ${estados}"
                                    th:value="${e}"
                                    th:text="${e}">VACUNADO</option>
                        </select>
                    </div>
                </div>

                <!-- Motivo si no se vacunó -->
                <div class="mb-3">
                    <label for="motivoNoVacunacion" class="form-label">Motivo de No Vacunación (Si aplica):</label>
                    <input type="text" id="motivoNoVacunacion" th:field="*{motivoNoVacunacion}" class="form-control" placeholder="Ej. Presentaba estado febril / Reacción alérgica previa" />
                </div>

                <!-- Observaciones -->
                <div class="mb-3">
                    <label for="observaciones" class="form-label">Observaciones:</label>
                    <textarea id="observaciones" th:field="*{observaciones}" class="form-control" rows="3" placeholder="Detalles generales de la visita..."></textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/registros-vacunacion}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
