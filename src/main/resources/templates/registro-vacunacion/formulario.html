<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title th:text="${registro.idRegistro != null} ? 'Editar Registro' : 'Nuevo Registro de Vacunación'">Formulario Registro</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="card-title mb-0 fs-5 fw-bold">
                        <i class="fas fa-notes-medical me-2"></i>
                        <span th:text="${registro.idRegistro != null} ? 'Editar Registro' : 'Nuevo Registro de Vacunación'">Formulario Registro</span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/registros-vacunacion/guardar}" th:object="${registro}" method="post">
                        <input type="hidden" th:field="*{idRegistro}" />

                        <div class="row mb-3">
                            <!-- Selector de Mascota -->
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="mascota" class="form-label fw-semibold">Mascota:</label>
                                <select id="mascota" th:field="*{mascota.idMascota}" class="form-select" required>
                                    <option value="">-- Seleccionar Mascota --</option>
                                    <option th:each="m : ${mascotas}"
                                            th:value="${m.idMascota}"
                                            th:text="${m.nombre}">Pelusa</option>
                                </select>
                            </div>

                            <!-- Selector de Campaña -->
                            <div class="col-md-6">
                                <label for="campana" class="form-label fw-semibold">Campaña:</label>
                                <select id="campana" th:field="*{campana.idCampana}" class="form-select" required>
                                    <option value="">-- Seleccionar Campaña --</option>
                                    <option th:each="c : ${campanas}"
                                            th:value="${c.idCampana}"
                                            th:text="${c.nombre}">Campaña Antirrábica</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <!-- Selector de Usuario/Aplicador -->
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="usuario" class="form-label fw-semibold">Usuario / Aplicador:</label>
                                <select id="usuario" th:field="*{usuario.idUsuario}" class="form-select" required>
                                    <option value="">-- Seleccionar Usuario --</option>
                                    <option th:each="u : ${usuarios}"
                                            th:value="${u.idUsuario}"
                                            th:text="${u.nombreCompleto}">Juan Perez</option>
                                </select>
                            </div>

                            <!-- Estado de Vacunación -->
                            <div class="col-md-6">
                                <label for="estado" class="form-label fw-semibold">Estado:</label>
                                <select id="estado" th:field="*{estado}" class="form-select" required>
                                    <option value="">-- Seleccionar Estado --</option>
                                    <option th:each="e : ${estados}"
                                            th:value="${e}"
                                            th:text="${e}">VACUNADO</option>
                                </select>
                            </div>
                        </div>

                        <!-- Motivo si no se vacunó -->
                        <div class="mb-3">
                            <label for="motivoNoVacunacion" class="form-label fw-semibold">Motivo de No Vacunación (Si aplica):</label>
                            <input type="text" id="motivoNoVacunacion" th:field="*{motivoNoVacunacion}" class="form-control" placeholder="Ej. Presentaba estado febril / Reacción alérgica previa" />
                        </div>

                        <!-- Observaciones -->
                        <div class="mb-4">
                            <label for="observaciones" class="form-label fw-semibold">Observaciones:</label>
                            <textarea id="observaciones" th:field="*{observaciones}" class="form-control" rows="3" placeholder="Detalles generales de la visita..."></textarea>
                        </div>

                        <!-- Acciones -->
                        <div class="d-flex justify-content-between pt-3 border-top">
                            <a th:href="@{/registros-vacunacion}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save me-1"></i>Guardar Registro
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
