<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Responsables</title>
</head>
<body>

<div layout:fragment="content">
    <h1 class="mt-4">Gestión de Responsables</h1>
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item active">Mantenimiento de Responsables</li>
    </ol>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <div>
                <i class="fas fa-user-shield me-1"></i>
                Listado de Responsables
            </div>
            <a th:href="@{/responsables/nuevo}" class="btn btn-primary btn-sm">
                <i class="fas fa-plus me-1"></i>Nuevo Responsable
            </a>
        </div>
        <div class="card-body">
            <!-- Mensajes de alerta -->
            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-1"></i>
                <span th:text="${mensajeExito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-triangle me-1"></i>
                <span th:text="${mensajeError}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Tabla de Responsables -->
            <table class="table table-striped table-bordered table-hover mt-2">
                <thead class="table-dark">
                <tr>
                    <th style="width: 8%;">ID</th>
                    <th>Nombre Completo</th>
                    <th>Teléfono</th>
                    <th>Documento de Identidad</th>
                    <th style="width: 20%;" class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="responsable : ${responsables}">
                    <td th:text="${responsable.idResponsable}">1</td>
                    <td th:text="${responsable.nombreCompleto}">Nombre del Responsable</td>
                    <td th:text="${responsable.telefono}">0000-0000</td>
                    <td th:text="${responsable.documentoIdentidad}">00000000-0</td>
                    <td class="text-center">
                        <a th:href="@{/responsables/editar/{id}(id=${responsable.idResponsable})}"
                           class="btn btn-warning btn-sm me-1"
                           title="Editar">
                            <i class="fas fa-edit"></i> Editar
                        </a>
                        <a th:href="@{/responsables/eliminar/{id}(id=${responsable.idResponsable})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Está seguro de eliminar este responsable?');"
                           title="Eliminar">
                            <i class="fas fa-trash"></i> Eliminar
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(responsables)}">
                    <td colspan="5" class="text-center text-muted py-3">
                        No hay responsables registrados actualmente.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
