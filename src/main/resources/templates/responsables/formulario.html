<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title th:text="${titulo != null ? titulo : 'Formulario Responsable'}">Responsable</title>
</head>
<body>

<div layout:fragment="content">
    <h1 class="mt-4" th:text="${titulo != null ? titulo : 'Formulario de Responsable'}">Formulario</h1>
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item"><a th:href="@{/responsables}">Responsables</a></li>
        <li class="breadcrumb-item active">Formulario</li>
    </ol>

    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">
                    <i class="fas fa-user-shield me-1"></i>
                    Datos del Responsable
                </div>
                <div class="card-body">
                    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-triangle me-1"></i>
                        <span th:text="${mensajeError}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!--/*@thymesVar id="responsable" type="org.esfe.vacunacion.modelos.Responsable"*/-->
                    <form th:action="@{/responsables/guardar}" th:object="${responsable}" method="post">
                        <!-- Campo oculto para el ID -->
                        <input type="hidden" th:field="*{idResponsable}" />

                        <div class="mb-3">
                            <label for="nombreCompleto" class="form-label">Nombre Completo</label>
                            <input type="text"
                                   id="nombreCompleto"
                                   class="form-control"
                                   th:field="*{nombreCompleto}"
                                   placeholder="Ingrese el nombre completo"
                                   required />
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="text"
                                   id="telefono"
                                   class="form-control"
                                   th:field="*{telefono}"
                                   placeholder="Ingrese el número de teléfono"
                                   required />
                        </div>

                        <div class="mb-3">
                            <label for="documentoIdentidad" class="form-label">Documento de Identidad</label>
                            <input type="text"
                                   id="documentoIdentidad"
                                   class="form-control"
                                   th:field="*{documentoIdentidad}"
                                   placeholder="Ingrese el DUI o documento"
                                   required />
                        </div>

                        <div class="d-flex justify-content-between pt-2">
                            <a th:href="@{/responsables}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save me-1"></i>Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
