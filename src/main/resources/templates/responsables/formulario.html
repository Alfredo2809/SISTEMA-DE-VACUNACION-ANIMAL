<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Responsable</title>
</head>
<body>

<h1>Registrar / Editar Responsable</h1>

<form th:action="@{/responsables/guardar}" th:object="${responsable}" method="post">

    <input type="hidden" th:field="*{idResponsable}" />

    <label>Nombre Completo:</label>
    <input type="text" th:field="*{nombreCompleto}" required />
    <br>

    <label>Teléfono:</label>
    <input type="text" th:field="*{telefono}" required />
    <br>

    <label>Documento de Identidad:</label>
    <input type="text" th:field="*{documentoIdentidad}" required />
    <br>

    <button type="submit">Guardar</button>
    <a th:href="@{/responsables}">Cancelar</a>

</form>

</body>
</html>
