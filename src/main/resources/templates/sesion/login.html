<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ESFE</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-lg border-0 rounded-lg p-4" style="width: 400px;">
    <div class="card-header bg-transparent text-center border-0 pb-0">
        <h3 class="font-weight-light my-2">ESFE - Vacunación</h3>
        <p class="text-muted small">Ingrese sus credenciales de acceso</p>
    </div>

    <div class="card-body">
        <!-- Mensajes de Alerta -->
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
            <i class="fas fa-exclamation-circle me-1"></i> Correo o contraseña incorrectos.
        </div>

        <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show py-2 small" role="alert">
            <i class="fas fa-info-circle me-1"></i> Sesión cerrada exitosamente.
        </div>

        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show py-2 small" role="alert" th:text="${exito}">
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2 small" role="alert" th:text="${error}">
        </div>

        <!-- Formulario de Iniciar Sesión -->
        <form th:action="@{/login}" method="post">

            <!-- Campo Correo -->
            <div class="form-floating mb-3">
                <input type="email"
                       class="form-control"
                       id="correo"
                       name="correo"
                       placeholder="nombre@ejemplo.com"
                       required />
                <label for="correo"><i class="fas fa-envelope me-2"></i>Correo Electrónico</label>
            </div>

            <!-- Campo Contraseña -->
            <div class="form-floating mb-3">
                <input type="password"
                       class="form-control"
                       id="contrasena"
                       name="contrasena"
                       placeholder="Contraseña"
                       required />
                <label for="contrasena"><i class="fas fa-lock me-2"></i>Contraseña</label>
            </div>

            <!-- Botón de Ingreso -->
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg fs-6">
                    <i class="fas fa-sign-in-alt me-2"></i>Ingresar
                </button>
            </div>
        </form>
    </div>

    <div class="card-footer text-center bg-transparent border-0 pt-0">
        <div class="small text-muted">&copy; ESFE - Sistema de Vacunación Animal</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
