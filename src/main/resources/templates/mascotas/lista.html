
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
  <title>Mascotas</title>
</head>
<body>
<div layout:fragment="content">

  <h2 class="mt-4">Mascotas</h2>
  <ol class="breadcrumb mb-4">
    <li class="breadcrumb-item active">Tabla de Mascotas</li>
  </ol>

  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span><i class="fas fa-paw"></i> Tabla de Mascotas</span>
      <a th:href="@{/mascotas/crear}" class="btn btn-primary btn-sm">
        <i class="fas fa-plus"></i> Nueva mascota
      </a>
    </div>
    <div class="card-body">

      <div class="table-responsive">
        <table class="table table-bordered table-striped" width="100%" cellspacing="0">
          <thead>
          <tr>
            <th>Nombre</th>
            <th>Especie</th>
            <th>Fecha nacimiento</th>
            <th>Edad (meses)</th>
            <th>Estado</th>
            <th>Responsable</th>
            <th>Vivienda</th>
            <th>Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="m : ${mascotas}">
            <td th:text="${m.nombre}"></td>
            <td th:text="${m.especie}"></td>
            <td th:text="${m.fechaNacimiento}"></td>
            <td th:text="${m.edadAproximadaMeses}"></td>
            <td th:text="${m.estado}"></td>
            <td th:text="${m.responsable != null ? m.responsable.nombreCompleto : '-'}"></td>
            <td th:text="${m.vivienda != null ? m.vivienda.direccion : '-'}"></td>
            <td>
              <a th:href="@{/mascotas/editar/{id}(id=${m.idMascota})}"
                 class="btn btn-sm btn-warning" title="Editar">
                <i class="fas fa-edit"></i>
              </a>

              <!-- Cambio rápido de estado -->
              <form th:action="@{/mascotas/{id}/cambiar-estado(id=${m.idMascota})}"
                    method="post" class="d-inline-block">
                <select name="nuevoEstado" class="form-select form-select-sm d-inline-block w-auto"
                        onchange="this.form.submit()">
                  <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"
                          th:selected="${e == m.estado}"></option>
                </select>
              </form>

              <form th:action="@{/mascotas/eliminar/{id}(id=${m.idMascota})}"
                    method="post" class="d-inline-block"
                    onsubmit="return confirm('¿Eliminar esta mascota?');">
                <button type="submit" class="btn btn-sm btn-danger" title="Eliminar">
                  <i class="fas fa-trash"></i>
                </button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

</div>
</body>
</html>iv>
  </div>

</div>
</body>
</html>
