<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Lista de Departamentos</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Gestión de Departamentos</h2>
        <a th:href="@{/geografico/departamentos/crear}" class="btn btn-primary">+ Nuevo Departamento</a>
    </div>

    <!-- Alertas -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm mb-4">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="d : ${departamentos}">
                    <td th:text="${d.idDepartamento}">1</td>
                    <td th:text="${d.nombre}">San Salvador</td>
                    <td class="text-center">
                        <a th:href="@{/geografico/departamentos/detalles/{id}(id=${d.idDepartamento})}" class="btn btn-info btn-sm text-white">Detalles</a>
                        <a th:href="@{/geografico/departamentos/editar/{id}(id=${d.idDepartamento})}" class="btn btn-warning btn-sm text-white">Editar</a>
                        <a th:href="@{/geografico/departamentos/eliminar/{id}(id=${d.idDepartamento})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Está seguro de eliminar este departamento?');">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(departamentos)}">
                    <td colspan="3" class="text-center text-muted py-3">No hay departamentos registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Paginación de 4 elementos -->
        <div th:if="${totalPages > 1}" class="card-footer d-flex justify-content-between align-items-center bg-white border-top py-2">
            <div>
                <small class="text-muted" th:text="'Página ' + (${currentPage} + 1) + ' de ' + ${totalPages} + ' (Total: ' + ${totalItems} + ')'"></small>
            </div>
            <nav aria-label="Navegación de páginas">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/geografico/departamentos(page=${currentPage - 1})}">Anterior</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/geografico/departamentos(page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/geografico/departamentos(page=${currentPage + 1})}">Siguiente</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

</body>
</html>
