<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles del Municipio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-info text-white">
            <h4 class="mb-0">Detalles del Municipio</h4>
        </div>
        <div class="card-body">
            <ul class="list-group list-group-flush">
                <li class="list-group-item"><strong>ID:</strong> <span th:text="${municipio.idMunicipio}"></span></li>
                <li class="list-group-item"><strong>Nombre:</strong> <span th:text="${municipio.nombre}"></span></li>
                <li class="list-group-item"><strong>Departamento:</strong> <span th:text="${municipio.departamento != null ? municipio.departamento.nombre : 'N/A'}"></span></li>
            </ul>
        </div>
        <div class="card-footer d-flex justify-content-between">
            <a th:href="@{/geografico/municipios}" class="btn btn-secondary">Volver</a>
            <a th:href="@{/geografico/municipios/editar/{id}(id=${municipio.idMunicipio})}" class="btn btn-warning">Editar</a>
        </div>
    </div>
</div>
</body>
</html>
