<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Lista de Cantones</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Gestión de Cantones</h2>
        <a th:href="@{/geografico/cantones/crear}" class="btn btn-primary">+ Nuevo Cantón</a>
    </div>

    <!-- Alertas -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Municipio</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${cantones}">
                    <td th:text="${c.idCanton}">1</td>
                    <td th:text="${c.nombre}">El Carmen</td>
                    <td th:text="${c.municipio != null ? c.municipio.nombre : 'Sin asignación'}">San Salvador</td>
                    <td class="text-center">
                        <a th:href="@{/geografico/cantones/detalles/{id}(id=${c.idCanton})}" class="btn btn-info btn-sm">Detalles</a>
                        <a th:href="@{/geografico/cantones/editar/{id}(id=${c.idCanton})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/geografico/cantones/eliminar/{id}(id=${c.idCanton})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Está seguro de eliminar este cantón?');">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(cantones)}">
                    <td colspan="4" class="text-center text-muted">No hay cantones registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
