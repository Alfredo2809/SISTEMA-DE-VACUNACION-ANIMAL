<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title th:text="${titulo}">Formulario Colonia</title>
</head>
<body>

<div layout:fragment="content">
    <div class="container mt-4" style="max-width: 600px;">


        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${mensajeError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0" th:text="${titulo}">Formulario Colonia</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/geografico/colonias}" th:object="${colonia}" method="post">
                    <input type="hidden" th:field="*{idColonia}">

                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-bold">Nombre de la Colonia</label>
                        <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Ej. Las Margaritas">
                    </div>

                    <div class="mb-3">
                        <label for="canton" class="form-label fw-bold">Cantón</label>
                        <select class="form-select" id="canton" th:field="*{canton.idCanton}">
                            <option value="">-- Seleccionar Cantón --</option>
                            <option th:each="c : ${cantones}"
                                    th:value="${c.idCanton}"
                                    th:text="${c.nombre}"></option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/geografico/colonias}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
