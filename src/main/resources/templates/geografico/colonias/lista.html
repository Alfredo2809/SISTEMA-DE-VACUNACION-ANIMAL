<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Lista de Colonias</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Gestión de Colonias</h2>
        <a th:href="@{/geografico/colonias/crear}" class="btn btn-primary">+ Nueva Colonia</a>
    </div>

    <!-- Alertas -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Cantón</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="col : ${colonias}">
                    <td th:text="${col.idColonia}">1</td>
                    <td th:text="${col.nombre}">Col. Escalón</td>
                    <td th:text="${col.canton != null ? col.canton.nombre : 'Sin asignación'}">El Carmen</td>
                    <td class="text-center">
                        <a th:href="@{/geografico/colonias/detalles/{id}(id=${col.idColonia})}" class="btn btn-info btn-sm">Detalles</a>
                        <a th:href="@{/geografico/colonias/editar/{id}(id=${col.idColonia})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/geografico/colonias/eliminar/{id}(id=${col.idColonia})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Está seguro de eliminar esta colonia?');">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(colonias)}">
                    <td colspan="4" class="text-center text-muted">No hay colonias registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
